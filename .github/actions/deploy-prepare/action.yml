---
# Factored out of deploy-run.yml so deploy-run-setup-all.yml and deploy-run-setup-service.yml
# don't duplicate the checkout/inventory/tooling/secrets steps.
#
# Expects to run inside the ghcr.io/devture/ansible container (set via `container:` on the
# calling job), which already provides git, just, ansible and agru -- so there's no bash
# either, hence `shell: sh` throughout.
name: Deploy prepare
description: Checks out the pinned inventory, optimizes for the target host, and writes SSH/secrets material.

inputs:
  host:
    required: true
  ref:
    description: mash-playbook ref to deploy. Empty deploys the ref this job started from.
    required: false
  gh_pat:
    required: true
  ssh_private_key:
    required: true
  bw_clientid:
    description: Bitwarden API key client_id, for non-interactive secret fetching.
    required: true
  bw_clientsecret:
    description: Bitwarden API key client_secret.
    required: true
  bw_password:
    description: Bitwarden master password, to unlock the vault after API-key login.
    required: true
  bw_vault_prefix:
    description: >-
      Screaming-snake-case of the Vaultwarden host, e.g. VAULT_OLIVERLORENZ_COM. It
      names the <prefix>__BW_* repo secrets and is turned back into the server URL
      (https://vault.oliverlorenz.com). Domains containing a hyphen are not representable.
    required: true

outputs:
  deployed_sha:
    description: Commit SHA of mash-playbook that was checked out
    value: ${{ steps.resolve.outputs.sha }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.ref }}

    - name: Trust the checked-out workspace
      shell: sh
      # $GITHUB_WORKSPACE is bind-mounted from a directory the host-side runner process
      # created (owned by the runner user), but we run as root inside the container, so git
      # refuses every command below with "detected dubious ownership" otherwise -- the same
      # issue docs/ansible.md warns about for running this image manually. Without this, the
      # `git rev-parse` calls below fail silently (their output is swallowed by the `$(...)`
      # command substitution) and produce an empty deployed_sha / inventory pin.
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Record deployed commit
      id: resolve
      shell: sh
      # Assigning the substitution first (rather than `echo "sha=$(...)"` directly) means a
      # failing `git rev-parse` fails this step under `set -e`, instead of being swallowed by
      # `echo`'s own exit code and silently producing an empty deployed_sha.
      run: |
        sha="$(git rev-parse HEAD)"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"

    - name: Resolve pinned inventory commit
      id: inventory
      shell: sh
      run: |
        sha="$(git rev-parse HEAD:inventory)"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"

    - name: Checkout inventory
      uses: actions/checkout@v4
      with:
        repository: oliverlorenz/mash-inventories
        token: ${{ inputs.gh_pat }}
        path: inventory
        ref: ${{ steps.inventory.outputs.sha }}

    - name: Cache Ansible roles
      uses: actions/cache@v4
      with:
        path: roles/galaxy
        key: ansible-roles-${{ hashFiles('requirements.yml') }}

    - name: Optimize for host
      shell: sh
      env:
        HOST: ${{ inputs.host }}
      run: just optimize-for-host "$HOST"

    - name: Install Ansible roles
      shell: sh
      run: just roles

    - name: Write SSH private key
      shell: sh
      env:
        SSH_PRIVATE_KEY: ${{ inputs.ssh_private_key }}
        HOST: ${{ inputs.host }}
      # Hardcode /root/.ssh rather than ~/.ssh: the Actions runner sets $HOME to
      # /github/home for container jobs, which is what the shell's tilde expands to here --
      # but ssh's own *implicit* default IdentityFile/UserKnownHostsFile lookup (no -i /
      # ansible_ssh_private_key_file is set, so this is what ansible relies on) resolves `~`
      # via the passwd entry for the running user instead, i.e. /root for the root user this
      # container runs as. Writing to ~/.ssh silently produces a key ssh never looks at,
      # failing with "Permission denied (publickey,password)" against the real host.
      #
      # The key/host arrive via env, not `${{ }}` inlined into the script: an inlined
      # value is pasted verbatim into the shell text, so anything in it that looks like
      # `$(...)`, backticks or `\` is executed/mangled. `printf '%s\n' "$VAR"` writes the
      # expansion literally (no re-parsing) and, unlike `echo`, never eats backslashes.
      run: |
        mkdir -p /root/.ssh
        printf '%s\n' "$SSH_PRIVATE_KEY" > /root/.ssh/id_ed25519
        chmod 600 /root/.ssh/id_ed25519
        ssh-keyscan -H "$HOST" >> /root/.ssh/known_hosts
        host_ip="$(getent ahostsv4 "$HOST" | head -n1 | awk '{print $1}')"
        if [ -n "$host_ip" ]; then
          ssh-keyscan -H "$host_ip" >> /root/.ssh/known_hosts
        fi

    - name: Install Bitwarden CLI and jfq
      shell: sh
      # The devture/ansible container (Alpine) has no node; the Bitwarden CLI and jfq (the
      # JSONata filter bin/receive_secrets.sh pipes item lists through) come from npm, and
      # jq is used by that script too. libc6-compat is for the bw CLI's native SDK bindings,
      # which ship glibc-only prebuilds. bw CLI is pinned: >= 2026.2.0 crashes on login
      # against self-hosted Vaultwarden with "Cannot read properties of null (reading
      # 'toWrappedAccountCryptographicState')" (bitwarden/clients#19553, #19413).
      run: |
        apk add --no-cache nodejs npm jq libc6-compat
        npm install -g @bitwarden/cli@2026.1.0 jfq

    - name: Fetch secrets from Bitwarden
      shell: sh
      env:
        BW_CLIENTID: ${{ inputs.bw_clientid }}
        BW_CLIENTSECRET: ${{ inputs.bw_clientsecret }}
        BW_PASSWORD: ${{ inputs.bw_password }}
        BW_VAULT_PREFIX: ${{ inputs.bw_vault_prefix }}
        HOST: ${{ inputs.host }}
      # Non-interactive API-key login (see bin/receive_secrets.sh). Writes
      # inventory/host_vars/$HOST/secrets.yml from the Bitwarden folder named after the host,
      # one variable per item. Credentials arrive via env, never inlined as `${{ }}`.
      # The server URL is the prefix lower-cased with `_` -> `.` (VAULT_OLIVERLORENZ_COM ->
      # https://vault.oliverlorenz.com).
      run: |
        BW_SERVER="https://$(printf '%s' "$BW_VAULT_PREFIX" | tr 'A-Z_' 'a-z.')"
        export BW_SERVER
        just -f justfile.custom receive_secrets folder "$HOST"
