---
# Entry point (user-triggered). Orchestrates deploy -> record known-good -> approval-gated
# auto-rollback. The actual deploy step is factored out to deploy-run-setup-all.yml so it
# can be reused here for both the initial deploy (below) and the rollback job.
#
# `host` accepts either an inventory group (e.g. "all" or "mash_servers") or a single host.
# resolve-hosts below expands whatever is chosen to the concrete host list via
# `ansible-inventory --limit`, and the deploy/rollback jobs fan that list out as a parallel
# matrix so every host gets its own deployed/<host> tag and rollback decision. The group and
# host options are kept in sync with the inventory by bin/sync-deploy-workflow-options.py
# (the "# BEGIN GENERATED: groups" / "# BEGIN GENERATED: hosts" blocks). record-rollback-success
# is intentionally not present: rollback redeploys exactly the sha the deployed/<host> tag
# already points to, so re-tagging it afterwards would be a no-op.
name: Deploy - setup-all

on:
  workflow_dispatch:
    inputs:
      host:
        description: Inventory group or single host to deploy to.
        required: true
        type: choice
        options:
          # BEGIN GENERATED: groups
          - all
          - mash_servers
          # END GENERATED: groups
          # BEGIN GENERATED: hosts
          - homeserver.oliverlorenz.com
          - mash.oliverlorenz.com
          # END GENERATED: hosts
        default: mash_servers
      ref:
        description: mash-playbook ref (branch, tag, or commit) to deploy. Leave empty to deploy the ref this workflow is run from.
        required: false
        type: string

permissions:
  contents: write

jobs:
  resolve-hosts:
    name: Resolve target hosts
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.resolve.outputs.hosts }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve pinned inventory commit
        id: inventory
        run: echo "sha=$(git rev-parse HEAD:inventory)" >> "$GITHUB_OUTPUT"

      - name: Checkout inventory
        uses: actions/checkout@v4
        with:
          repository: oliverlorenz/mash-inventories
          token: ${{ secrets.GH_PAT }}
          path: inventory
          ref: ${{ steps.inventory.outputs.sha }}

      - name: Install Ansible
        run: pip install ansible regex

      - name: Resolve hosts
        id: resolve
        # `host` is a group (all, mash_servers, ...) or a single host; --limit expands both.
        run: |
          echo "hosts=$(ansible-inventory -i inventory/hosts.yml --list --limit '${{ inputs.host }}' | jq -c '._meta.hostvars | keys')" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy (${{ matrix.host }})
    needs: resolve-hosts
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.resolve-hosts.outputs.hosts) }}
    uses: ./.github/workflows/deploy-run-setup-all.yml
    with:
      host: ${{ matrix.host }}
      ref: ${{ inputs.ref }}
    secrets: inherit

  record-success:
    name: Record last known-good ref (${{ matrix.host }})
    needs: [resolve-hosts, deploy]
    if: needs.deploy.result == 'success'
    strategy:
      matrix:
        host: ${{ fromJson(needs.resolve-hosts.outputs.hosts) }}
    uses: ./.github/workflows/record-deployed-ref.yml
    with:
      host: ${{ matrix.host }}
      # Same ref is deployed to every host, so every matrix instance resolves the same sha.
      sha: ${{ needs.deploy.outputs.deployed_sha }}
    secrets: inherit

  await-rollback-approval:
    name: Await rollback approval
    needs: deploy
    if: failure()
    environment: rollback-approval
    runs-on: ubuntu-latest
    steps:
      - run: echo "Approved -- proceeding with rollback of all targeted hosts."

  rollback:
    name: Auto-rollback (${{ matrix.host }})
    needs: [resolve-hosts, await-rollback-approval]
    if: always() && needs.await-rollback-approval.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.resolve-hosts.outputs.hosts) }}
    uses: ./.github/workflows/deploy-run-setup-all.yml
    with:
      host: ${{ matrix.host }}
      rollback: true
    secrets: inherit
