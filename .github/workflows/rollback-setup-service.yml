---
# Manual rollback entry point, service-scoped counterpart of rollback-setup-all.yml. Reuses
# deploy-run-setup-service.yml (the same job the normal deploy uses) so rolling back is just
# "deploy an older ref".
#
# `host` accepts an inventory group (e.g. "all" or "mash_servers") or a single host.
# resolve-hosts expands whatever is chosen to the concrete host list via
# `ansible-inventory --limit`, and the rollback jobs fan it out as a parallel matrix, all to
# the same explicit `ref`. The group and host options are kept in sync with the inventory by
# bin/sync-deploy-workflow-options.py (the "# BEGIN GENERATED: groups" / "# BEGIN GENERATED:
# hosts" blocks).
name: Rollback - setup-service

on:
  workflow_dispatch:
    inputs:
      ref:
        description: mash-playbook ref (tag, branch, or commit SHA) to roll back to. The inventory pin recorded at that ref is deployed alongside it.
        required: true
        type: string
      host:
        description: Inventory group or single host to roll back.
        required: true
        type: choice
        options:
          # BEGIN GENERATED: groups
          - all
          - mash_servers
          # END GENERATED: groups
          # BEGIN GENERATED: hosts
          - homeserver.oliverlorenz.com
          - mash.oliverlorenz.com
          # END GENERATED: hosts
        default: mash_servers
      service:
        description: Service to set up
        required: true
        type: choice
        options:
          # BEGIN GENERATED: services
          - app-dooropener
          - auxiliary
          - bentopdf
          - cleanup
          - container_socket_proxy
          - convertx
          - dayplanner
          - dns_records
          - docker
          - docker_sdk_for_python
          - ffc-hello
          - ffc-mesh-client
          - gotosocial
          - gowa
          - headplane
          - headscale
          - jellyfin
          - languagetool
          - music-assistant
          - n8n
          - ohrwurm
          - oliverlorenz-api
          - openwebui
          - paperless
          - paperless_ai
          - playbook_help
          - playbook_runtime_messages
          - postgres
          - rssbridge
          - systemd_docker_base
          - systemd_service_manager
          - tailscale
          - timesync
          - tinyauth
          - traefik
          - tsdproxy
          - uptime_kuma
          - valkey
          - vaultwarden
          # END GENERATED: services

permissions:
  contents: write

jobs:
  resolve-hosts:
    name: Resolve target hosts
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.resolve.outputs.hosts }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve pinned inventory commit
        id: inventory
        run: echo "sha=$(git rev-parse HEAD:inventory)" >> "$GITHUB_OUTPUT"

      - name: Checkout inventory
        uses: actions/checkout@v4
        with:
          repository: oliverlorenz/mash-inventories
          token: ${{ secrets.GH_PAT }}
          path: inventory
          ref: ${{ steps.inventory.outputs.sha }}

      - name: Install Ansible
        run: pip install ansible regex

      - name: Resolve hosts
        id: resolve
        # `host` is a group (all, mash_servers, ...) or a single host; --limit expands both.
        run: |
          echo "hosts=$(ansible-inventory -i inventory/hosts.yml --list --limit '${{ inputs.host }}' | jq -c '._meta.hostvars | keys')" >> "$GITHUB_OUTPUT"

  rollback:
    name: Rollback to ${{ inputs.ref }} (${{ matrix.host }})
    needs: resolve-hosts
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.resolve-hosts.outputs.hosts) }}
    uses: ./.github/workflows/deploy-run-setup-service.yml
    with:
      service: ${{ inputs.service }}
      host: ${{ matrix.host }}
      ref: ${{ inputs.ref }}
    secrets: inherit

  record-success:
    name: Record last known-good ref (${{ matrix.host }})
    needs: [resolve-hosts, rollback]
    if: success()
    strategy:
      matrix:
        host: ${{ fromJson(needs.resolve-hosts.outputs.hosts) }}
    uses: ./.github/workflows/record-deployed-ref.yml
    with:
      host: ${{ matrix.host }}
      # Same explicit ref is rolled back to on every host, so every matrix instance resolves
      # the same sha.
      sha: ${{ needs.rollback.outputs.deployed_sha }}
    secrets: inherit
