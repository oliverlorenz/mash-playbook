---
# Deprecated: superseded by deploy-run-setup-all.yml / deploy-run-setup-service.yml, which
# use the shared deploy-prepare action instead of duplicating these steps inline. Called
# only from deploy.yml and rollback.yml, which are deprecated for the same reason.
name: Deploy (core)

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      service:
        required: false
        type: string
      host:
        required: true
        type: string
      ref:
        description: mash-playbook ref to deploy. Empty deploys the ref this workflow run started from.
        required: false
        type: string
    outputs:
      deployed_sha:
        description: Commit SHA of mash-playbook that was deployed
        value: ${{ jobs.run.outputs.deployed_sha }}

permissions:
  contents: read

jobs:
  run:
    name: Deploy (${{ inputs.mode }})
    runs-on: ubuntu-latest
    outputs:
      deployed_sha: ${{ steps.resolve.outputs.sha }}
    env:
      # Vaultwarden host as SCREAMING_SNAKE_CASE -- names the `<prefix>__BW_*` repo secrets
      # and is turned back into the server URL by the Fetch step below.
      BW_VAULT_PREFIX: ${{ vars.BW_VAULT_PREFIX || 'VAULT_OLIVERLORENZ_COM' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Record deployed commit
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve pinned inventory commit
        id: inventory
        run: echo "sha=$(git rev-parse HEAD:inventory)" >> "$GITHUB_OUTPUT"

      - name: Checkout inventory
        uses: actions/checkout@v4
        with:
          repository: oliverlorenz/mash-inventories
          token: ${{ secrets.GH_PAT }}
          path: inventory
          ref: ${{ steps.inventory.outputs.sha }}

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install Ansible
        run: pip install ansible regex

      - name: Optimize for host
        run: just optimize-for-host ${{ inputs.host }}

      - name: Install Ansible roles
        run: just roles

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ inputs.host }}" >> ~/.ssh/known_hosts
          host_ip="$(getent ahostsv4 "${{ inputs.host }}" | head -n1 | awk '{print $1}')"
          if [ -n "$host_ip" ]; then
            ssh-keyscan -H "$host_ip" >> ~/.ssh/known_hosts
          fi

      - name: Install Bitwarden CLI and jfq
        # bw CLI is pinned: >= 2026.2.0 crashes on login against self-hosted Vaultwarden
        # (bitwarden/clients#19553, #19413). jfq is the JSONata filter receive_secrets uses.
        run: npm install -g @bitwarden/cli@2026.1.0 jfq

      - name: Fetch secrets from Bitwarden
        env:
          BW_CLIENTID: ${{ secrets[format('{0}__BW_CLIENTID', env.BW_VAULT_PREFIX)] }}
          BW_CLIENTSECRET: ${{ secrets[format('{0}__BW_CLIENT_SECRET', env.BW_VAULT_PREFIX)] }}
          BW_PASSWORD: ${{ secrets[format('{0}__BW_PASSWORD', env.BW_VAULT_PREFIX)] }}
          HOST: ${{ inputs.host }}
        run: |
          BW_SERVER="https://$(printf '%s' "$BW_VAULT_PREFIX" | tr 'A-Z_' 'a-z.')"
          export BW_SERVER
          just -f justfile.custom receive_secrets folder "$HOST"

      - name: Deploy (setup-service)
        if: inputs.mode == 'setup-service'
        run: just -f justfile.custom setup-service ${{ inputs.service }} ${{ inputs.host }}

      - name: Deploy (setup-all)
        if: inputs.mode == 'setup-all'
        run: just -f justfile.custom setup-all ${{ inputs.host }}
