---
# Reusable deploy step, split out of deploy-setup-service.yml for the same reason as
# deploy-run-setup-all.yml: called from the deploy + auto-rollback jobs in
# deploy-setup-service.yml, and from the manual rollback in rollback-setup-service.yml.
# `rollback: true` resolves the deployed/<host> tag itself (rather than the caller passing a
# resolved sha) so each host in a matrix run resolves independently -- job outputs can't be
# fanned out per-matrix-instance to a downstream job in GitHub Actions.
name: Deploy run (setup-service)

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      host:
        required: true
        type: string
      ref:
        description: mash-playbook ref to deploy. Empty deploys the ref this workflow run started from. Ignored when `rollback` is true.
        required: false
        type: string
      rollback:
        description: If true, ignore `ref` and deploy the last known-good ref recorded for this host (refs/tags/deployed/<host>).
        required: false
        type: boolean
        default: false
    outputs:
      deployed_sha:
        description: Commit SHA of mash-playbook that was deployed
        value: ${{ jobs.run.outputs.deployed_sha }}

permissions:
  contents: read

jobs:
  run:
    name: deploy
    runs-on: ubuntu-latest
    # Ships git, just, ansible and agru already, so deploy-prepare doesn't need to install
    # any of that itself.
    container: ghcr.io/devture/ansible:14.0.0-r0-3
    outputs:
      deployed_sha: ${{ steps.prepare.outputs.deployed_sha }}
    env:
      # Vaultwarden host as SCREAMING_SNAKE_CASE. Names the `<prefix>__BW_*` repo secrets
      # holding the API credentials, and deploy-prepare turns it back into the server URL.
      # Override with a repo variable if a host's secrets live in a different vault.
      BW_VAULT_PREFIX: ${{ vars.BW_VAULT_PREFIX || 'VAULT_OLIVERLORENZ_COM' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Rollback needs full history to resolve the deployed/<host> tag below.
          fetch-depth: ${{ inputs.rollback && 0 || 1 }}

      - name: Trust the checked-out workspace
        if: inputs.rollback
        # See the identical step in deploy-prepare for why this is needed: git refuses to
        # touch $GITHUB_WORKSPACE otherwise, since it's owned by the host-side runner user
        # rather than the root we run as inside the container.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve last known-good ref
        id: resolve-rollback
        if: inputs.rollback
        run: |
          if git rev-parse -q --verify "refs/tags/deployed/${{ inputs.host }}" >/dev/null; then
            sha="$(git rev-parse "refs/tags/deployed/${{ inputs.host }}")"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No previously successful deploy recorded for host '${{ inputs.host }}' -- nothing to roll back to."
            exit 1
          fi

      - name: Prepare
        id: prepare
        uses: ./.github/actions/deploy-prepare
        with:
          host: ${{ inputs.host }}
          ref: ${{ inputs.rollback && steps.resolve-rollback.outputs.sha || inputs.ref }}
          gh_pat: ${{ secrets.GH_PAT }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          bw_clientid: ${{ secrets[format('{0}__BW_CLIENTID', env.BW_VAULT_PREFIX)] }}
          bw_clientsecret: ${{ secrets[format('{0}__BW_CLIENT_SECRET', env.BW_VAULT_PREFIX)] }}
          bw_password: ${{ secrets[format('{0}__BW_PASSWORD', env.BW_VAULT_PREFIX)] }}
          bw_vault_prefix: ${{ env.BW_VAULT_PREFIX }}

      - name: Deploy
        run: just -f justfile.custom setup-service ${{ inputs.service }} ${{ inputs.host }}
