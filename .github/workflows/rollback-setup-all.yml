---
# Manual rollback entry point. Reuses deploy-run-setup-all.yml (the same job the normal
# deploy uses) so rolling back is just "deploy an older ref".
#
# `host` accepts an inventory group (e.g. "all" or "mash_servers") or a single host.
# resolve-hosts expands whatever is chosen to the concrete host list via
# `ansible-inventory --limit`, and the rollback jobs fan it out as a parallel matrix, all to
# the same explicit `ref`. The group and host options are kept in sync with the inventory by
# bin/sync-deploy-workflow-options.py (the "# BEGIN GENERATED: groups" / "# BEGIN GENERATED:
# hosts" blocks).
name: Rollback - setup-all

on:
  workflow_dispatch:
    inputs:
      ref:
        description: mash-playbook ref (tag, branch, or commit SHA) to roll back to. The inventory pin recorded at that ref is deployed alongside it.
        required: true
        type: string
      host:
        description: Inventory group or single host to roll back.
        required: true
        type: choice
        options:
          # BEGIN GENERATED: groups
          - all
          - mash_servers
          # END GENERATED: groups
          # BEGIN GENERATED: hosts
          - homeserver.oliverlorenz.com
          - mash.mitsinnen.me
          - mash.oliverlorenz.com
          # END GENERATED: hosts
        default: mash_servers

permissions:
  contents: write

jobs:
  resolve-hosts:
    name: Resolve target hosts
    runs-on: ubuntu-latest
    # Same image the deploy jobs run in, so the inventory host list is resolved by exactly
    # the ansible version that will consume it -- and there's no separate ansible install to
    # wait on. Ships no bash (hence `shell: sh`) and no jq.
    container: ghcr.io/devture/ansible:14.0.0-r0-3
    outputs:
      hosts: ${{ steps.resolve.outputs.hosts }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Trust the checked-out workspace
        shell: sh
        # git otherwise refuses $GITHUB_WORKSPACE as "dubious ownership": the dir is owned by
        # the host-side runner user, but we run as root inside the container. Same reason as
        # the identical step in deploy-prepare.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve pinned inventory commit
        id: inventory
        shell: sh
        run: |
          sha="$(git rev-parse HEAD:inventory)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout inventory
        uses: actions/checkout@v4
        with:
          repository: oliverlorenz/mash-inventories
          token: ${{ secrets.GH_PAT }}
          path: inventory
          ref: ${{ steps.inventory.outputs.sha }}

      - name: Resolve hosts
        id: resolve
        shell: sh
        # `host` is a group (all, mash_servers, ...) or a single host; --limit expands both.
        # The container ships no jq, so python extracts the host keys (sorted, like jq's `keys`).
        run: |
          ansible-inventory -i inventory/hosts.yml --list --limit '${{ inputs.host }}' \
            | python3 -c 'import json, sys; print("hosts=" + json.dumps(sorted(json.load(sys.stdin)["_meta"]["hostvars"])))' \
            >> "$GITHUB_OUTPUT"

  rollback:
    name: Rollback to ${{ inputs.ref }} (${{ matrix.host }})
    needs: resolve-hosts
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.resolve-hosts.outputs.hosts) }}
    uses: ./.github/workflows/deploy-run-setup-all.yml
    with:
      host: ${{ matrix.host }}
      ref: ${{ inputs.ref }}
    secrets: inherit

  record-success:
    name: Record last known-good ref (${{ matrix.host }})
    needs: [resolve-hosts, rollback]
    if: success()
    strategy:
      matrix:
        host: ${{ fromJson(needs.resolve-hosts.outputs.hosts) }}
    uses: ./.github/workflows/record-deployed-ref.yml
    with:
      host: ${{ matrix.host }}
      # Same explicit ref is rolled back to on every host, so every matrix instance resolves
      # the same sha.
      sha: ${{ needs.rollback.outputs.deployed_sha }}
    secrets: inherit
