---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
oliverlorenz_api_enabled: false

oliverlorenz_api_uid: "{{ mash_playbook_uid }}"
oliverlorenz_api_gid: "{{ mash_playbook_gid }}"

oliverlorenz_api_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}
oliverlorenz_api_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
