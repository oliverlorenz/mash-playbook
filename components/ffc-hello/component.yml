---

# Custom role of this fork: roles/custom/ffc-hello
activation_prefix: ffc_hello_
description: A tiny nginx hello-world demo/smoke-test service (custom)

setup:
  entry:
    - role: custom/ffc-hello

inject:
  systemd_service_manager:
    services:
      - name: "{{ ffc_hello_identifier }}.service"
        priority: 2100
        restart_necessary: true
        groups: [mash, ffc-hello]
        when: "{{ ffc_hello_enabled }}"
