---

# Custom role of this fork: roles/custom/ohrwurm
activation_prefix: ohrwurm_
description: Ohrwurm app (custom)

setup:
  entry:
    - role: custom/ohrwurm

inject:
  systemd_service_manager:
    services:
      - name: "{{ ohrwurm_identifier }}.service"
        priority: 2000
        restart_necessary: true
        groups: [mash, ohrwurm]
        when: "{{ ohrwurm_enabled }}"
