---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
ohrwurm_enabled: false

ohrwurm_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}
ohrwurm_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"

ohrwurm_environment_session_secret: "{{ '%s' | format(mash_playbook_generic_secret_key) | password_hash('sha512', 'ses.ohrwurm', rounds=655555) | to_uuid }}"
