---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
gowa_enabled: false

gowa_uid: "{{ mash_playbook_uid }}"
gowa_gid: "{{ mash_playbook_gid }}"

gowa_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

gowa_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
