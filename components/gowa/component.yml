---

# Custom role of this fork: roles/custom/gowa
activation_prefix: gowa_
description: GOWA, a WhatsApp Web multi-device API (custom)

setup:
  entry:
    - role: custom/gowa

inject:
  systemd_service_manager:
    services:
      - name: "{{ gowa_identifier }}.service"
        priority: 2000
        restart_necessary: true
        groups: [mash, gowa]
        when: "{{ gowa_enabled }}"
