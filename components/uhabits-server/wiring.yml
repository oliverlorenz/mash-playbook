---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
uhabits_server_enabled: false

uhabits_server_uid: "{{ mash_playbook_uid }}"
uhabits_server_gid: "{{ mash_playbook_gid }}"

uhabits_server_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}
uhabits_server_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
