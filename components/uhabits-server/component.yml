---

# Custom role of this fork: roles/custom/uhabits-server
activation_prefix: uhabits_server_
description: Server for sharing habits with friends, Loop Habit Tracker (custom)

setup:
  entry:
    - role: custom/uhabits-server

inject:
  systemd_service_manager:
    services:
      - name: "{{ uhabits_server_identifier }}.service"
        priority: 2000
        restart_necessary: true
        groups: [mash, uhabits-server]
        when: "{{ uhabits_server_enabled }}"
