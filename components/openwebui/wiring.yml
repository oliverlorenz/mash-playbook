---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
openwebui_enabled: false

openwebui_identifier: "{{ mash_playbook_service_identifier_prefix }}openwebui"

openwebui_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}openwebui"

openwebui_uid: "{{ mash_playbook_uid }}"
openwebui_gid: "{{ mash_playbook_gid }}"

openwebui_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

openwebui_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
openwebui_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"

openwebui_secret_key: "{{ (mash_playbook_generic_secret_key + ':openwebui') | hash('sha512') | to_uuid }}"
