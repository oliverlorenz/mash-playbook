---

# Custom role of this fork: roles/custom/openwebui
activation_prefix: openwebui_
description: Open WebUI, a web interface for LLMs (custom)

setup:
  entry:
    - role: custom/openwebui

inject:
  systemd_service_manager:
    services:
      - name: "{{ openwebui_identifier }}.service"
        priority: 2000
        restart_necessary: true
        groups: [mash, openwebui]
        when: "{{ openwebui_enabled }}"
