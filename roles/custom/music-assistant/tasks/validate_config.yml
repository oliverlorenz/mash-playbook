---
- name: Run if Traefik is enabled
  when: music_assistant_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for music-assistant are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item }}`).
      when: "lookup('vars', item, default='') | string | length == 0"
      with_items:
        - music_assistant_container_labels_traefik_hostname
        - music_assistant_container_labels_traefik_path_prefix
