---
- name: Check existence of uhabits-server systemd service
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ uhabits_server_identifier }}.service"
  register: uhabits_server_service_stat

- name: Uninstall uhabits-server systemd services and files
  when: uhabits_server_service_stat.stat.exists | bool
  block:
    - name: Ensure uhabits-server systemd service is stopped
      ansible.builtin.service:
        name: "{{ uhabits_server_identifier }}"
        state: stopped
        enabled: false
        daemon_reload: true

    - name: Ensure uhabits-server systemd service does not exist
      ansible.builtin.file:
        path: "{{ devture_systemd_docker_base_systemd_path }}/{{ uhabits_server_identifier }}.service"
        state: absent

    - name: Ensure uhabits-server container network does not exist via community.docker.docker_network
      when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
      community.docker.docker_network:
        name: "{{ uhabits_server_container_network }}"
        state: absent

    - name: Ensure uhabits-server container network does not exist via ansible.builtin.command
      when: devture_systemd_docker_base_container_network_creation_method == 'command'
      ansible.builtin.command:
        cmd: >-
          {{ devture_systemd_docker_base_host_command_docker }} network rm
          {{ uhabits_server_container_network }}
      register: network_deletion_result
      changed_when: uhabits_server_container_network in network_deletion_result.stdout

    - name: Ensure uhabits-server path does not exist
      ansible.builtin.file:
        path: "{{ uhabits_server_base_path }}"
        state: absent
