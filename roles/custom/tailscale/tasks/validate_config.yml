---
- name: Fail if this host's OS is not supported by the tailscale role
  ansible.builtin.fail:
    msg: >-
      The tailscale role only knows how to install Tailscale's apt repository
      (Debian/Ubuntu). This host's OS family is `{{ ansible_facts['os_family'] }}`.
  when: ansible_facts['os_family'] != 'Debian'

- name: Fail if a required tailscale configuration setting is not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - tailscale_login_server
    - tailscale_authkey
