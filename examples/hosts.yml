# To connect using a non-root user (and elevate to root with sudo later), replace
# `ansible_ssh_user: root` with something like `ansible_ssh_user: username` plus
# `ansible_become: true` and `ansible_become_user: root`.
# If sudo requires a password, either add `ansible_become_password: PASSWORD_HERE` to the host
# or tell Ansible to ask you for it by adding `--ask-become-pass` (`-K`) to all `ansible-playbook`
# (or `just`) commands.
#
# For improved Ansible performance, SSH pipelining is enabled by default in `ansible.cfg`.
# If this causes SSH connection troubles, disable it by adding `ansible_ssh_pipelining: false`
# to the host or to your variables file.
#
# If SSH listens on a non-standard port (i.e. something other than 22), add
# `ansible_port: <your configured SSH port>` to the host.
#
# If you're running this Ansible playbook on the same server as the one you're installing to,
# consider adding `ansible_connection: local` to the host.
#
# Ansible may fail to discover which Python interpreter to use on the host for some distros
# (like Ubuntu 20.04). You may sometimes need to explicitly add
# `ansible_python_interpreter: /usr/bin/python3` to the host.

---
mash_servers:
  hosts:
    <your-domain>:
      ansible_host: <your-server's external IP address>
      ansible_ssh_user: root
